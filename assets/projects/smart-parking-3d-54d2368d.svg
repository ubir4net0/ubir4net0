<svg xmlns="http://www.w3.org/2000/svg" width="840" height="269" viewBox="0 0 840 269" role="img" aria-labelledby="t d">
  <title id="t">Smart Parking 3D</title>
  <desc id="d">Gêmeo digital 3D de um estacionamento inteligente para Sistemas Digitais: carros 3D, cancelas, sensores binários, contador de 4 bits e máquinas de estados. Motor lógico em TypeScript puro, separado da cena: portas AND/OR/NOT/XOR nas regras, contador em cascata e 55 testes que checam colisões e invariantes a cada quadro. Stack: React, TypeScript, Three.js, Vite, Tailwind CSS, Vitest.</desc>
