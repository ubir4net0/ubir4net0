<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="t d">
  <title id="t">API de Gestão de Eventos</title>
  <desc id="d">API de back-office para eventos esportivos: autenticação SPA por sessão, controle de acesso por perfil, provas e modalidades, e integração com plataforma de ingressos. Filas com Redis/Horizon, análise estática com Larastan e testes de feature com PHPUnit. Stack: Laravel 13, PHP 8.4, PostgreSQL, Redis.</desc>
