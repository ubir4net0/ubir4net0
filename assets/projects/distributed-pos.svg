<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="t d">
  <title id="t">PDV Distribuído</title>
  <desc id="d">Sistema de ponto de venda com worker independente: checkout idempotente, reservas de estoque e mensageria transacional com outbox/inbox. Autor único: API, worker, interface React, contratos OpenAPI, ADRs e quatro workflows de CI com Postgres e RabbitMQ reais. Stack: Java 21, Spring Boot, RabbitMQ, PostgreSQL, Flyway, React, TypeScript.</desc>
