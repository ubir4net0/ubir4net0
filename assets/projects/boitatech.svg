<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="t d">
  <title id="t">BoitaTech</title>
  <desc id="d">Plataforma de monitoramento ambiental com mapas geoespaciais 2D/3D, denúncias cidadãs com consentimento LGPD, ecopontos e curadoria de notícias. 5º lugar entre os finalistas. Inclui controle do mapa por gestos das mãos com MediaPipe. Stack: Laravel, PHP, PostgreSQL, Leaflet, CesiumJS, MediaPipe, Tailwind CSS, Vite.</desc>
