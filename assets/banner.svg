    <text x="798" y="138" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">1</text>
    <text x="824" y="138" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#5B8DEF">export const </tspan><tspan fill="#F0F6FC">dev</tspan><tspan fill="#8B949E"> = {</tspan></text>
