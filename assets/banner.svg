    <text x="824" y="160" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F0F6FC">  role</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#00BFFF">&quot;full stack&quot;</tspan><tspan fill="#8B949E">,</tspan></text>
    <text x="798" y="182" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">3</text>
    <text x="824" y="182" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F0F6FC">  backend</tspan><tspan fill="#8B949E">: [</tspan><tspan fill="#00BFFF">&quot;Laravel&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#00BFFF">&quot;NestJS&quot;</tspan><tspan fill="#8B949E">],</tspan></text>
    <text x="798" y="204" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">4</text>
    <text x="824" y="204" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F0F6FC">  frontend</tspan><tspan fill="#8B949E">: [</tspan><tspan fill="#00BFFF">&quot;Vue&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#00BFFF">&quot;React&quot;</tspan><tspan fill="#8B949E">],</tspan></text>
    <text x="798" y="226" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">5</text>
    <text x="824" y="226" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F0F6FC">  data</tspan><tspan fill="#8B949E">: [</tspan><tspan fill="#00BFFF">&quot;PostgreSQL&quot;</tspan><tspan fill="#8B949E">, </tspan><tspan fill="#00BFFF">&quot;MySQL&quot;</tspan><tspan fill="#8B949E">],</tspan></text>
    <text x="798" y="248" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">6</text>
    <text x="824" y="248" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F0F6FC">  ships</tspan><tspan fill="#8B949E">: </tspan><tspan fill="#00BFFF">true</tspan><tspan fill="#8B949E">,</tspan></text>
    <text x="798" y="270" fill="#30363D" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13">7</text>
    <text x="824" y="270" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8B949E">};</tspan></text>
  <rect x="845.4" y="257" width="8" height="16" fill="#00BFFF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
